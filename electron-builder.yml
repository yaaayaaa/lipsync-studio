appId: net.yaaaa.lipsync-studio
productName: lipsync-studio
directories:
  output: release
# 実行時に要るのは vite の出力（dist/）と main / preload（dist-electron/）だけ。
# src/・samples/・docs/ は入れない。型定義と tsc の増分ビルド情報も実行には要らない。
# node_modules は electron-builder が package.json の dependencies だけを自動で入れる。
# 画面側のライブラリ（react など）は vite が dist/ に束ねるので devDependencies に置き、
# dependencies には main / preload が実行時に require するものだけを置く
files:
  - dist/**
  - dist-electron/**
  - '!dist-electron/**/*.d.ts'
  - '!dist-electron/.tsbuildinfo'
  - package.json
# ルートの package.json は "type": "module" だが、main / preload は CommonJS で出している。
# dist-electron/package.json の目印が万一抜けても main が ESM として読まれて起動できなくならないよう、
# 同梱する package.json 側でも CommonJS と明示する（画面側は app:// で読むので type の影響を受けない）
extraMetadata:
  type: commonjs
mac:
  # universal にしない（大きさが倍になるため）。arm64 と x64 を別々に作る
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.video
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 資格情報（APPLE_API_KEY・APPLE_API_KEY_ID・APPLE_API_ISSUER）は scripts/dist-mac.sh が環境変数で渡す
  notarize: true
dmg:
  # dmg も署名し、scripts/notarize-dmg.cjs で公証して票を貼る（electron-builder は .app しか公証しない）
  sign: true
  # 公証の票を貼ると dmg の中身が変わり、先に計算された sha512 と blockmap が合わなくなる。
  # Mac の自動更新は zip しか使わないので、dmg は latest-mac.yml に載せない
  writeUpdateInfo: false
# dmg ができてから publish（アップロード）されるまでの間に呼ばれる
artifactBuildCompleted: ./scripts/notarize-dmg.cjs
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  # 既定の名前（"lipsync-studio Setup 0.0.0.exe"）は空白を含み、latest.yml に書かれる名前（空白→-）と食い違う
  artifactName: ${productName}-Setup-${version}.${ext}
  # 利用者ごと（%LOCALAPPDATA%\Programs）に入れ、選ばせない。「すべてのユーザー」を選べる案内型だと
  # Program Files に入り、終了時の自動更新のたびに UAC の確認が出て「知らせずに更新」が崩れるため
  oneClick: true
  perMachine: false
publish:
  provider: github
  owner: yaaayaaa
  repo: lipsync-studio
